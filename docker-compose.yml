services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: IMFA_PMS
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
        - .:/app:cached
    command: ["npm", "run", "dev"]
